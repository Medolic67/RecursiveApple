<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recursive Apples</title>
<style>
  :root{
    --fg: #39ff6a;
    --fg-dim: #1f7a3a;
    --border: #1f4a2c;
    --panel: rgba(10,13,10,0.85);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  #stage{
    width:100vw; height:100vh; display:flex; align-items:center; justify-content:center;
  }
  #gridCanvas{
    display:block;
    width: min(100vw, 100vh * (4 / 3));
    height: min(100vh, 100vw * (3 / 4));
  }

  #overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; color:var(--fg); z-index:10; text-align:center; cursor:pointer;
  }
  #overlay.hidden{ display:none; }
  #overlay h1{ font-size:16px; letter-spacing:0.06em; margin:0 0 8px; font-weight:600; }
  #overlay p{ font-size:12px; color:var(--fg-dim); margin:0; }
  #overlay.error{ cursor:default; }
  #overlay.error h1{ color:#ff5c5c; }

  #bar{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; padding:8px 14px;
    background:var(--panel); border:1px solid var(--border); border-radius:3px;
    color:var(--fg); font-size:12px; z-index:5; opacity:0.55; transition:opacity 0.15s;
  }
  #bar.hidden{ display:none; }
  #bar:hover{ opacity:1; }
  #bar button{
    background:transparent; border:1px solid var(--fg-dim); color:var(--fg);
    padding:5px 12px; font-family:inherit; font-size:12px; cursor:pointer; border-radius:2px;
  }
  #bar button:hover{ border-color:var(--fg); }
</style>
</head>
<body>

<div id="stage">
  <canvas id="gridCanvas" width="480" height="360"></canvas>
</div>

<div id="overlay">
  <div>
    <h1 id="overlayTitle">Recursive Apples</h1>
    <p id="overlayText">loading…</p>
  </div>
</div>

<div id="bar" class="hidden">
  <button id="pauseBtn">pause</button>
  <button id="restartBtn">restart</button>
  <span id="recIndicator" style="display:none;color:#ff5c5c;">● rec</span>
</div>

<video id="video" src="audio.mp4" playsinline style="display:none"></video>

<script>
(() => {
  const WHITE_THRESHOLD = 153;  // matches the original convert.py: gray > 153 -> white
  const EXTRACT_INTERVAL_MS = 1000 / 30; // sample the video at ~30fps

  // A region only recurses into the previous frame's buffer when it's meaningfully smaller
  // than the full canvas (i.e. there's actual room to nest a smaller copy in it). Anything
  // close to full-frame size just shows the real live video directly instead.
  const GROUND_SCALE_THRESHOLD = 1.2;
  // Even a persistently-small region can't recurse forever: once a pixel's lineage has
  // passed through this many recursive generations, it's forced back to the real live frame.
  const MAX_RECURSION_DEPTH = 6;

  const canvas = document.getElementById('gridCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height; // fixed native resolution: 480x360
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const bar = document.getElementById('bar');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');
  const video = document.getElementById('video');
  const recIndicator = document.getElementById('recIndicator');

  let lastExtractTime = -1;
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordingStarted = false;

  // offscreen canvas the video frame is drawn onto each sample, at full native resolution
  const extractCanvas = document.createElement('canvas');
  extractCanvas.width = W;
  extractCanvas.height = H;
  const extractCtx = extractCanvas.getContext('2d', { willReadFrequently: true });

  // reused scratch buffers so nothing is re-allocated 30x/sec
  const isWhite = new Uint8Array(W * H);
  const rawRGB = new Uint8ClampedArray(W * H * 3); // this frame's actual captured video color, for grounding
  const label = new Int16Array(W * H);
  const stack = new Int32Array(W * H);

  // Double-buffered recursive feedback, color + a parallel "how many recursive generations
  // deep is this pixel" counter. Both start at zero/black — there's nothing to recurse into
  // on frame 1, so everything grounds to the real video until history builds up.
  const bufA = new Uint8ClampedArray(W * H * 4);
  const bufB = new Uint8ClampedArray(W * H * 4);
  for (let i = 3; i < bufA.length; i += 4) { bufA[i] = 255; bufB[i] = 255; }
  const depthA = new Uint8Array(W * H);
  const depthB = new Uint8Array(W * H);
  const imgDataA = new ImageData(bufA, W, H);
  const imgDataB = new ImageData(bufB, W, H);
  let readBuf = bufA, readDepth = depthA;
  let writeBuf = bufB, writeDepth = depthB, writeImgData = imgDataB;

  function showError(message) {
    overlay.classList.remove('hidden');
    overlay.classList.add('error');
    overlayTitle.textContent = 'Recursive Apples';
    overlayText.textContent = message;
    bar.classList.add('hidden');
  }

  function loadVideoMetadata() {
    return new Promise((resolve, reject) => {
      if (video.readyState >= 1) return resolve();
      video.addEventListener('loadedmetadata', () => resolve(), { once: true });
      video.addEventListener('error', () => reject(new Error(
        'could not load this file as a video (unsupported codec/container in this browser)'
      )), { once: true });
    });
  }

  // Draw the video's current frame at full native resolution, threshold every pixel, and
  // keep the real captured color around (rawRGB) for grounding.
  function extractFrame() {
    extractCtx.drawImage(video, 0, 0, W, H);
    const data = extractCtx.getImageData(0, 0, W, H).data;
    for (let p = 0, o = 0, o3 = 0; p < W * H; p++, o += 4, o3 += 3) {
      const r = data[o], g = data[o + 1], b = data[o + 2];
      const gray = 0.299 * r + 0.587 * g + 0.114 * b;
      isWhite[p] = gray > WHITE_THRESHOLD ? 1 : 0;
      rawRGB[o3] = r; rawRGB[o3 + 1] = g; rawRGB[o3 + 2] = b;
    }
  }

  // 4-connected (edge-adjacency only) component labeling over the white pixels.
  // Returns bboxes[]; `label[y*W+x]` holds each pixel's component index, or -1 if black.
  function computeWhiteComponents() {
    label.fill(-1);
    const bboxes = [];
    let next = 0;
    for (let start = 0; start < W * H; start++) {
      if (!isWhite[start] || label[start] !== -1) continue;
      let minX = W, minY = H, maxX = -1, maxY = -1;
      let sp = 0;
      stack[sp++] = start;
      label[start] = next;
      while (sp > 0) {
        const idx = stack[--sp];
        const x = idx % W, y = (idx / W) | 0;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        if (x > 0) { const n = idx - 1; if (isWhite[n] && label[n] === -1) { label[n] = next; stack[sp++] = n; } }
        if (x < W - 1) { const n = idx + 1; if (isWhite[n] && label[n] === -1) { label[n] = next; stack[sp++] = n; } }
        if (y > 0) { const n = idx - W; if (isWhite[n] && label[n] === -1) { label[n] = next; stack[sp++] = n; } }
        if (y < H - 1) { const n = idx + W; if (isWhite[n] && label[n] === -1) { label[n] = next; stack[sp++] = n; } }
      }
      bboxes.push({ minX, minY, maxX, maxY });
      next++;
    }
    return bboxes;
  }

  function drawFrame() {
    extractFrame();
    const bboxes = computeWhiteComponents();

    // precompute each component's cover-fit placement + whether it's even eligible to recurse
    const drawX = new Float32Array(bboxes.length);
    const drawY = new Float32Array(bboxes.length);
    const invScale = new Float32Array(bboxes.length);
    const eligible = new Uint8Array(bboxes.length); // 0 = ground (too close to full-frame size)
    for (let lbl = 0; lbl < bboxes.length; lbl++) {
      const { minX, minY, maxX, maxY } = bboxes[lbl];
      const boxW = maxX - minX + 1, boxH = maxY - minY + 1;
      const scale = Math.max(boxW / W, boxH / H); // source (readBuf) is always W x H
      eligible[lbl] = scale > GROUND_SCALE_THRESHOLD ? 1 : 0;
      const dW = W * scale, dH = H * scale;
      drawX[lbl] = minX + (boxW - dW) / 2;
      drawY[lbl] = minY + (boxH - dH) / 2;
      invScale[lbl] = 1 / scale;
    }

    for (let y = 0, p = 0; y < H; y++) {
      for (let x = 0; x < W; x++, p++) {
        const o = p * 4, o3 = p * 3;
        const lbl = label[p];

        if (lbl === -1) {
          // black: always flat
          writeBuf[o] = 0; writeBuf[o + 1] = 0; writeBuf[o + 2] = 0; writeBuf[o + 3] = 255;
          writeDepth[p] = 0;
          continue;
        }

        if (eligible[lbl]) {
          let sx = (x - drawX[lbl]) * invScale[lbl] | 0;
          let sy = (y - drawY[lbl]) * invScale[lbl] | 0;
          if (sx < 0) sx = 0; else if (sx >= W) sx = W - 1;
          if (sy < 0) sy = 0; else if (sy >= H) sy = H - 1;
          const sp = sy * W + sx;
          const sourceDepth = readDepth[sp];

          if (sourceDepth < MAX_RECURSION_DEPTH) {
            const so = sp * 4;
            writeBuf[o] = readBuf[so];
            writeBuf[o + 1] = readBuf[so + 1];
            writeBuf[o + 2] = readBuf[so + 2];
            writeBuf[o + 3] = 255;
            writeDepth[p] = sourceDepth + 1;
            continue;
          }
        }

        // grounded: too close to full-frame size, or hit the recursion depth cap — show the real video
        writeBuf[o] = rawRGB[o3]; writeBuf[o + 1] = rawRGB[o3 + 1]; writeBuf[o + 2] = rawRGB[o3 + 2]; writeBuf[o + 3] = 255;
        writeDepth[p] = 0;
      }
    }

    ctx.putImageData(writeImgData, 0, 0);

    // swap: this frame's output becomes next frame's recursion source
    let tmp = readBuf; readBuf = writeBuf; writeBuf = tmp;
    tmp = readDepth; readDepth = writeDepth; writeDepth = tmp;
    writeImgData = (writeBuf === bufA) ? imgDataA : imgDataB;
  }

  function renderLoop(ts) {
    if (!video.paused && !video.ended) {
      if (ts - lastExtractTime >= EXTRACT_INTERVAL_MS) {
        lastExtractTime = ts;
        drawFrame();
      }
    }
    requestAnimationFrame(renderLoop);
  }

  function pickMimeType() {
    const candidates = [
      'video/mp4;codecs=h264,aac',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    for (const t of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
    }
    return '';
  }

  // Records the canvas + the source video's own audio track from the moment playback truly
  // starts, and auto-downloads the result once the video ends. Runs once per page load.
  function startRecording() {
    if (recordingStarted) return;
    if (!canvas.captureStream || !window.MediaRecorder) return; // unsupported browser, skip quietly
    recordingStarted = true;
    try {
      const vStream = canvas.captureStream(30);
      let aTracks = [];
      const captureAV = video.captureStream || video.mozCaptureStream;
      if (captureAV) {
        aTracks = captureAV.call(video).getAudioTracks();
      }
      const combined = new MediaStream([...vStream.getVideoTracks(), ...aTracks]);
      const mimeType = pickMimeType();
      mediaRecorder = mimeType ? new MediaRecorder(combined, { mimeType }) : new MediaRecorder(combined);
      recordedChunks = [];
      mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = saveRecording;
      mediaRecorder.start();
      if (recIndicator) recIndicator.style.display = 'inline';
    } catch (e) {
      recordingStarted = false;
      console.warn('recording unavailable:', e);
    }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  }

  function saveRecording() {
    if (recIndicator) recIndicator.style.display = 'none';
    if (!recordedChunks.length) return;
    const mimeType = mediaRecorder.mimeType || 'video/webm';
    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(recordedChunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Recursive-apples.' + ext;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  video.addEventListener('ended', stopRecording);

  async function begin() {
    try {
      await loadVideoMetadata();
      requestAnimationFrame(renderLoop);
      bar.classList.remove('hidden');
      tryAutoplay();
    } catch (e) {
      showError('something went wrong loading this — ' + e.message);
    }
  }

  function tryAutoplay() {
    const p = video.play();
    if (p && typeof p.catch === 'function') {
      p.then(() => {
        overlay.classList.add('hidden');
        startRecording();
      }).catch(() => {
        overlay.classList.remove('hidden');
        overlay.classList.remove('error');
        overlayTitle.textContent = 'Recursive Apples';
        overlayText.textContent = 'click to start';
        overlay.addEventListener('click', startFromGesture, { once: true });
      });
    } else {
      overlay.classList.add('hidden');
    }
  }

  function startFromGesture() {
    video.play();
    overlay.classList.add('hidden');
    startRecording();
  }

  pauseBtn.addEventListener('click', () => {
    if (video.paused) {
      video.play();
      pauseBtn.textContent = 'pause';
    } else {
      video.pause();
      pauseBtn.textContent = 'play';
    }
  });

  restartBtn.addEventListener('click', () => {
    video.currentTime = 0;
    video.play();
    pauseBtn.textContent = 'pause';
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !bar.classList.contains('hidden')) {
      e.preventDefault();
      pauseBtn.click();
    }
  });

  begin();
})();
</script>
</body>
</html>
